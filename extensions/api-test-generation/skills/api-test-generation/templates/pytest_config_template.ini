# Шаблон конфигурации pytest для тестового контура.
# Скопируй в корень проекта как `pytest.ini` (или в `pyproject.toml`
# под секцией [tool.pytest.ini_options]) и адаптируй под свой проект.

[pytest]
# Ключевые параметры прогона
addopts = -v
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Корень тестов. Если контур внутри каталога tests/ в корне проекта,
# оставь пустым или укажи явно. Для <test_root> = "tests" обычно пусто:
# testpaths =
#     tests

# Собирать тесты с именами test_*.py
python_files = test_*.py

# Настройка маркеров (важно: маркер обязан быть зарегистрирован,
# иначе pytest выдаёт warning PytestUnknownMarkWarning)
markers =
    smoke: быстрые проверки критичного функционала
    regression: полный регрессионный прогон
    slow: длительные/медленные тесты, можно исключать флагом -m "not slow"
