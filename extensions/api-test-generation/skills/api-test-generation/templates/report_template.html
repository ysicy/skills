<style>
:root{--bg:#0f1420;--panel:#161c2b;--panel2:#1c2436;--line:#27304a;--txt:#e6ebf4;--dim:#8b94ad;--green:#34d399;--red:#f87171;--amber:#fbbf24;--blue:#60a5fa;--violet:#a78bfa}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(160deg,#0b0f1a,#131a2b 55%,#0b0f1a);color:var(--txt);line-height:1.5}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:8px;padding:28px 22px 0}
h1{font-size:26px;margin:0;letter-spacing:-.3px}
h1 small{display:block;font-size:14px;color:var(--dim);font-weight:500;letter-spacing:.2px;margin-top:4px}
.tag{font-size:12px;padding:5px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--blue);white-space:nowrap}
.gates{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 22px}
.gate{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.gate .k{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.gate .v{font-size:30px;font-weight:700;margin-top:6px;line-height:1}
.gate .s{font-size:12px;color:var(--dim);margin-top:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:24px 22px 16px;border-bottom:1px solid var(--line);padding-bottom:12px}
.tab{background:var(--panel2);border:1px solid var(--line);color:var(--dim);padding:9px 16px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:500;transition:.15s}
.tab:hover{color:var(--txt);border-color:#39456b}
.tab.active{background:var(--blue);border-color:var(--blue);color:#0b0f1a}
.pane{display:none;padding:0 22px}
.pane.active{display:block;animation:fade .25s ease}
 @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:15px}
.card h4{margin:22px 0 10px;font-size:13px;color:var(--blue);text-transform:uppercase;letter-spacing:.4px}
.card .sub{color:var(--dim);font-size:12.5px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--dim);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid #1f273a;vertical-align:top}
tr:last-child td{border-bottom:none}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--panel2);border:1px solid var(--line);padding:2px 6px;border-radius:5px;color:var(--blue)}
.grp{background:var(--panel2);color:var(--dim);font-weight:600;font-size:12px;letter-spacing:.4px;text-transform:uppercase}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;letter-spacing:.3px}
.pass{background:rgba(52,211,153,.14);color:var(--green);border:1px solid rgba(52,211,153,.35)}
.fail{background:rgba(248,113,113,.14);color:var(--red);border:1px solid rgba(248,113,113,.35)}
.manual{background:rgba(251,191,36,.14);color:var(--amber);border:1px solid rgba(251,191,36,.35)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.dot.g{background:var(--green)}.dot.r{background:var(--red)}.dot.y{background:var(--amber)}.dot.b{background:var(--blue)}
.lvl{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.lvl.P0{background:rgba(248,113,113,.16);color:var(--red)}
.lvl.P1{background:rgba(251,191,36,.14);color:var(--amber)}
.lvl.P2{background:rgba(96,165,250,.16);color:var(--blue)}
.row-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.met-box{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.met-box .met-num{font-size:26px;font-weight:700;line-height:1}
.met-box .met-label{font-size:12px;margin-top:6px}
.met-box .met-sub{font-size:11px;color:var(--dim);margin-top:3px}
.met-warn{color:var(--amber)}.met-red{color:var(--red)}.met-good{color:var(--green)}
.f{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.f .method{font-size:11px;font-weight:700;letter-spacing:.4px}
.met-get{color:var(--green)}.met-post{color:var(--amber)}.met-patch{color:var(--violet)}.met-delete{color:var(--red)}
.f .path{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--txt);margin-top:3px;word-break:break-all}
.fg{height:12px;border-radius:6px;margin:6px 0;background:linear-gradient(90deg,var(--green),var(--amber)) 0/var(--p) 100% no-repeat,var(--panel);border:1px solid var(--line)}
.dim{color:var(--dim)}
.foot{margin:26px 22px;color:var(--dim);font-size:12px;text-align:center;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
.foot .foot-col{max-width:420px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:6px}
.timeline{margin-top:10px}
.tl-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;font-size:13px}
.tl-dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.l-g{background:var(--green)}.l-o{background:var(--amber)}.l-b{background:var(--blue)}
 @media(max-width:760px){.gates{grid-template-columns:repeat(2,1fr)}.row-grid{grid-template-columns:1fr 1fr}}
html{color-scheme:dark}
.wrap-x{overflow-x:auto}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--dim);font-size:12px}
.badge.ext{background:rgba(167,139,250,.14);color:var(--violet);border:1px solid rgba(167,139,250,.35)}
.badge.open{background:rgba(251,191,36,.14);color:var(--amber);border:1px solid rgba(251,191,36,.35)}
.badge.closed{background:rgba(52,211,153,.14);color:var(--green);border:1px solid rgba(52,211,153,.35)}
.empty{color:var(--dim);font-size:13px;padding:10px 0}
</style>
